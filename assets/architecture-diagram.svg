<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d9645f"/>
    </marker>
  </defs>

  <rect width="1000" height="320" fill="none"/>

  <!-- stage 1: input -->
  <rect x="10" y="120" width="150" height="80" rx="12" fill="#161619" stroke="#26262b" stroke-width="1.5"/>
  <text x="85" y="152" font-size="14" font-weight="600" fill="#f3f3f4" text-anchor="middle">Your model</text>
  <text x="85" y="172" font-size="12" fill="#9b9ba3" text-anchor="middle">+ prompt</text>

  <line x1="160" y1="160" x2="215" y2="160" stroke="#d9645f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- stage 2: two backends -->
  <rect x="220" y="60" width="200" height="80" rx="12" fill="#161619" stroke="#d9645f" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="320" y="90" font-size="14" font-weight="600" fill="#d9645f" text-anchor="middle">HF backend</text>
  <text x="320" y="110" font-size="11.5" fill="#9b9ba3" text-anchor="middle">FP16 · INT8 · NF4 · FP4</text>
  <text x="320" y="126" font-size="11.5" fill="#9b9ba3" text-anchor="middle">HQQ · Quanto · AWQ · GPTQ</text>

  <rect x="220" y="180" width="200" height="80" rx="12" fill="#161619" stroke="#e88a85" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="320" y="210" font-size="14" font-weight="600" fill="#e88a85" text-anchor="middle">vLLM backend</text>
  <text x="320" y="230" font-size="11.5" fill="#9b9ba3" text-anchor="middle">FP16 · BitsAndBytes</text>
  <text x="320" y="246" font-size="11.5" fill="#9b9ba3" text-anchor="middle">FP8 · AWQ · GPTQ</text>

  <line x1="425" y1="100" x2="475" y2="150" stroke="#d9645f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="425" y1="220" x2="475" y2="170" stroke="#e88a85" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- stage 3: metrics -->
  <rect x="480" y="120" width="190" height="80" rx="12" fill="#161619" stroke="#26262b" stroke-width="1.5"/>
  <text x="575" y="150" font-size="14" font-weight="600" fill="#f3f3f4" text-anchor="middle">Measured on your GPU</text>
  <text x="575" y="170" font-size="11.5" fill="#9b9ba3" text-anchor="middle">VRAM · TPS · TTFT · Perplexity</text>

  <line x1="670" y1="160" x2="725" y2="160" stroke="#d9645f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- stage 4: recommendation engine -->
  <rect x="730" y="120" width="150" height="80" rx="12" fill="#161619" stroke="#26262b" stroke-width="1.5"/>
  <text x="805" y="152" font-size="14" font-weight="600" fill="#f3f3f4" text-anchor="middle">Recommendation</text>
  <text x="805" y="172" font-size="12" fill="#9b9ba3" text-anchor="middle">engine</text>

  <line x1="880" y1="160" x2="925" y2="160" stroke="#d9645f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- stage 5: verdict -->
  <rect x="930" y="120" width="60" height="80" rx="12" fill="#d9645f" fill-opacity="0.12" stroke="#d9645f" stroke-width="1.5"/>
  <text x="960" y="155" font-size="20" text-anchor="middle">✓</text>
  <text x="960" y="185" font-size="11" fill="#e88a85" text-anchor="middle">Verdict</text>
</svg>
